{% extends 'admin_panel/base.html' %}
{% load static %}

{% block title %}Configuración - Panel Admin{% endblock %}

{% block breadcrumb %}
    <span class="breadcrumb-item"><a href="{% url 'admin_panel:dashboard' %}">Inicio</a></span>
    <span class="breadcrumb-item">Configuración</span>
{% endblock %}

{% block content %}
<div class="fade-in">
    <div class="page-header">
        <div>
            <h1 class="page-title">Configuración</h1>
            <p class="page-subtitle">Preferencias y notificaciones del sistema</p>
        </div>
    </div>

    <div class="row" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 24px;">
        <!-- Notificaciones -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-bell" style="color: var(--warning); margin-right: 8px;"></i>
                    Notificaciones
                </h3>
            </div>
            <div class="card-body">
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <label style="font-weight: 500; color: var(--text-secondary);">Alertas de stock bajo</label>
                        <input type="checkbox" checked style="width: 20px; height: 20px; cursor: pointer;">
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <label style="font-weight: 500; color: var(--text-secondary);">Pedidos nuevos</label>
                        <input type="checkbox" checked style="width: 20px; height: 20px; cursor: pointer;">
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <label style="font-weight: 500; color: var(--text-secondary);">Pedidos cancelados</label>
                        <input type="checkbox" checked style="width: 20px; height: 20px; cursor: pointer;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Botón Guardar -->
    <div style="display: flex; justify-content: flex-end;">
        <button class="btn btn-primary" style="padding: 10px 24px;">
            <i class="fas fa-save"></i> Guardar Configuración
        </button>
    </div>
</div>
{% endblock %}
